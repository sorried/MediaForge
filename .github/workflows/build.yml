name: Build and release
on:
  push:
    branches: [main, mediaforge/native-verification]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify native stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          test "$(uname -s)" = Darwin
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.6'
          test "$(xcodebuild -version | tail -n 1)" = 'Build version 17F113'
          xcrun swift --version
          plutil -lint MediaForge.xcodeproj/project.pbxproj
          xcodebuild -list -project MediaForge.xcodeproj
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests -v
          bash scripts/test-imports.sh
          bash scripts/test-persistence.sh
      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          version=1.0.0-dev
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; fi
          python3 scripts/release-version.py "$version"
          printf 'MEDIAFORGE_RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Build isolated LGPL FFmpeg
        run: scripts/build-ffmpeg.sh '${{ matrix.arch }}'
      - name: Run core XCTest and build real app
        run: scripts/build-app.sh '${{ matrix.arch }}' "$MEDIAFORGE_RELEASE_VERSION"
      - name: Configure optional Apple signing for tags only
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/setup-signing.sh
      - name: Package and verify ZIP DMG source checksums
        shell: bash
        run: |
          scripts/package.sh '${{ matrix.arch }}' "$MEDIAFORGE_RELEASE_VERSION"
      - name: Preserve native build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-diagnostics-${{ matrix.arch }}
          path: build/logs/${{ matrix.arch }}/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${MEDIAFORGE_KEYCHAIN:-}" ]]; then security delete-keychain "$MEDIAFORGE_KEYCHAIN"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MediaForge-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/MediaForge-*.zip
            dist/${{ matrix.arch }}/*.dmg
            dist/${{ matrix.arch }}/MediaForge-*.txt
          if-no-files-found: error
          retention-days: 14
  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: MediaForge-*
          path: release
          merge-multiple: true
      - name: Validate both architecture artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          for arch in arm64 x86_64; do
            if [[ "$arch" == arm64 ]]; then platform=AppleSilicon; else platform=Intel; fi
            test -f "MediaForge-macOS-14+-$platform.zip"
            test -f "MediaForge-macOS-14+-$platform.dmg"
            test -f "MediaForge-$TAG-$arch-FFmpeg-source.zip"
          done
          python3 ../scripts/verify-release.py . "$TAG"
          printf 'Separate native macOS 14+ builds. See each status file for actual signing and notarization state; ad-hoc builds are not Developer ID signed or notarized.\n\nThis software uses FFmpeg under LGPLv2.1 or later. Corresponding source and build records are attached alongside both binaries.\n' > notes.md
          gh release create "$TAG" --verify-tag --title "Media Forge $TAG" --notes-file notes.md MediaForge-*
